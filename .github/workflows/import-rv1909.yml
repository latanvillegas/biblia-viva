name: Import RV1909

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import_rv1909.py
      - .github/workflows/import-rv1909.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Importar RV1909 desde eBible
        run: python3 scripts/import_rv1909.py
      - name: Guardar texto generado
        run: |
          if git diff --quiet -- src/data/rv1909.generated.ts; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/rv1909.generated.ts
          git commit -m "data: import complete RV1909 public-domain text"
          git push
